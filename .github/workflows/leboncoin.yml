name: Huizenzoeker Frankrijk - Leboncoin

on:
  workflow_dispatch:

  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  contents: write

jobs:
  leboncoin:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python 3.13 installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python packages installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium installeren
        run: |
          python -m playwright install --with-deps chromium

      - name: Gmail OAuth bestanden aanmaken
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          credentials = os.environ.get("GMAIL_CREDENTIALS_JSON")
          token = os.environ.get("GMAIL_TOKEN_JSON")

          if not credentials:
              raise RuntimeError(
                  "GitHub Secret GMAIL_CREDENTIALS_JSON ontbreekt."
              )

          if not token:
              raise RuntimeError(
                  "GitHub Secret GMAIL_TOKEN_JSON ontbreekt."
              )

          Path("credentials.json").write_text(
              credentials,
              encoding="utf-8",
          )

          Path("token.json").write_text(
              token,
              encoding="utf-8",
          )

          print("Gmail OAuth bestanden aangemaakt.")
          PY

      - name: Secrets controleren
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          namen = [
              "EMAIL_PROVIDER",
              "EMAIL_ADDRESS",
              "EMAIL_PASSWORD",
              "EMAIL_TO",
              "OPENAI_API_KEY",
          ]

          ontbrekend = []

          for naam in namen:
              if os.getenv(naam):
                  print(f"{naam}: OK")
              else:
                  print(f"{naam}: ONTBREEKT")
                  ontbrekend.append(naam)

          if ontbrekend:
              print()
              print("Ontbrekende GitHub Secrets:")

              for naam in ontbrekend:
                  print(f"- {naam}")

              sys.exit(1)

          print()
          print("Alle benodigde secrets zijn beschikbaar.")
          PY
       
      - name: Leboncoin Huizenzoeker uitvoeren
        id: leboncoin_run
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          xvfb-run -a python leboncoin_runner.py

      - name: Foutmelding per e-mail versturen
        if: failure() && steps.leboncoin_run.outcome == 'failure'
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WORKFLOW_ERROR: "De automatische Leboncoin-run is mislukt. Controleer de GitHub Actions-run voor de exacte foutmelding."
        run: |
          python stuur_workflow_fout.py
          
      - name: Leboncoin status opslaan
        if: always()
        run: |
          git config user.name "Huizenzoeker Bot"
          git config user.email "huizenzoeker-bot@users.noreply.github.com"

          git add leboncoin_verwerkt.json
          git add leboncoin_retry.json
          git add leboncoin_onbeschikbaar.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in Leboncoin-status."
          else
            git commit -m "Update Leboncoin status na automatische run"
            git push
          fi